<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Notes Generator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #0f172a;
            color: white;
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin: auto;
            padding: 20px;
        }

        textarea {
            width: 100%;
            height: 180px;
            padding: 15px;
            border-radius: 10px;
            border: none;
            resize: none;
            font-size: 14px;
        }

        button {
            padding: 10px 15px;
            margin-top: 10px;
            border: none;
            border-radius: 8px;
            background: orange;
            color: white;
            cursor: pointer;
        }

        .card {
            background: #1e293b;
            padding: 15px;
            border-radius: 12px;
            margin-top: 15px;
        }

        .light {
            background: #f1f5f9;
            color: black;
        }

        .light .card {
            background: white;
        }

        .output-box {
            white-space: pre-wrap;
            line-height: 1.6;
            word-break: break-word;
        }

    </style>
</head>
<body>

<div class="container">

    <h2>📋 Cognify AI <span onclick="toggleMode()" style="cursor:pointer">🌙</span></h2>

    <!-- ✅ FORM (IMPORTANT FIX) -->
    <form method="POST" enctype="multipart/form-data">

        <textarea name="text" placeholder="Paste your notes here..."></textarea>

        <input type="file" name="pdf_file" accept="application/pdf">

        <br>
        <button type="submit">Generate Notes</button>

    </form>

    <!-- ✅ OUTPUT -->
    {% if notes %}
    <div class="card">
        <h3>📌 Generated Notes</h3>
        <div class="output-box">
            {% for n in notes %}
                • {{ n }}<br><br>
            {% endfor %}
        </div>
    </div>
    {% endif %}


<script>
function toggleMode() {
    document.body.classList.toggle("light");
}
</script>

</body>
</html>
